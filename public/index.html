<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CityScope</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(to right, #74ebd5, #ACB6E5);
      color: #333;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #fff;
      margin-bottom: 20px;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.3);
    }

    input[type="text"] {
      width: calc(100% - 120px);
      padding: 10px;
      border: none;
      border-radius: 5px 0 0 5px;
      font-size: 16px;
    }

    button {
      padding: 10px 20px;
      border: none;
      background-color: #ff7e5f;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      border-radius: 0 5px 5px 0;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #feb47b;
    }

    .search-box {
      display: flex;
      margin-bottom: 30px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    h2 {
      margin-top: 40px;
      color: #fff;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
    }

    .card {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: transform 0.2s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 12px rgba(0,0,0,0.15);
    }

    .card h3 {
      margin: 0 0 5px 0;
      color: #ff7e5f;
    }

    .card p {
      margin: 5px 0;
      line-height: 1.4;
    }

    a {
      color: #3498db;
      text-decoration: none;
      font-weight: bold;
    }

    a:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      .search-box {
        flex-direction: column;
      }

      input[type="text"] {
        width: 100%;
        border-radius: 5px;
        margin-bottom: 10px;
      }

      button {
        border-radius: 5px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>CityScope</h1>

    <div class="search-box">
      <input type="text" id="cityInput" placeholder="Enter city name">
      <button onclick="fetchData()">Get Data</button>
    </div>

    <h2>Weather</h2>
    <div id="weather"></div>

    <h2>News</h2>
    <div id="news"></div>
  </div>

  <script>
    async function fetchData() {
      const city = document.getElementById("cityInput").value.trim();
      if(!city) return alert("Please enter a city");

      try {
        // Fetch weather
        const weatherRes = await fetch(`/weather/${city}`);
        const weather = await weatherRes.json();
        if(weather.error) throw new Error(weather.error);

        document.getElementById("weather").innerHTML = `
          <div class="card" style="display:flex; align-items:center; gap:15px;">
            <img src="https://openweathermap.org/img/wn/${weather.icon}@2x.png" alt="${weather.description}" style="width:80px;height:80px;">
            <div>
              <h3>${city}, ${weather.country}</h3>
              <p><strong>Temperature:</strong> ${weather.temperature}°C</p>
              <p><strong>Feels Like:</strong> ${weather.feels_like}°C</p>
              <p><strong>Description:</strong> ${weather.description}</p>
              <p><strong>Coordinates:</strong> Lon ${weather.coordinates.lon}, Lat ${weather.coordinates.lat}</p>
              <p><strong>Wind Speed:</strong> ${weather.wind_speed} m/s</p>
              <p><strong>Rain (3h):</strong> ${weather.rain_volume} mm</p>
            </div>
          </div>
        `;


        // Fetch news
        const newsRes = await fetch(`/news/${city}`);
        const articles = await newsRes.json();
        if(articles.error) throw new Error(articles.error);

        document.getElementById("news").innerHTML = articles.map(a => `
          <div class="card">
            <h3>${a.title}</h3>
            <p>${a.description || "No description"}</p>
            <a href="${a.url}" target="_blank">Read more</a>
          </div>
        `).join('');

      } catch (err) {
        alert("Error: " + err.message);
        console.error(err);
      }
    }
  </script>
</body>
</html>
